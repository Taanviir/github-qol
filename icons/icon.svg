  <!-- sparkle the tentacle is reaching for -->
  <path d="M92 18c1.6 9 5.8 13.2 14.8 14.8-9 1.6-13.2 5.8-14.8 14.8-1.6-9-5.8-13.2-14.8-14.8 9-1.6 13.2-5.8 14.8-14.8Z" fill="#ffffff"/>
</svg>
